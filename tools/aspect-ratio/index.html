<body id="top">

<!-- ---------- --> 
<!--   HEADER   -->
<!-- ---------- -->
<div class="container">
	<div class="row py-3">
		<div class="col-12 text-center">
			<h1 class="mb-1 h4 fw-bold">
				Калькулятор пропорций
			</h1>
			<p class="small text-muted mb-1">
				Демо удобного калькулятора соотношения сторон (англ. — Aspect Ratio Calculator).
			</p>
			<p class="mb-1"><a href="https://github.com/uxuimedia/aspect-ratio-calculator">Репозиторий</a></p>
		</div>
	</div>
</div>
<!-- ---------- --> 
<!-- END HEADER -->
<!-- ---------- -->

<div class="container">
	<div class="row">
		<div class="col-12">
			<div class="box">
				<label for="initW">
				<span>Ширина (original width)</span>
				<input type="number" min="1" id="initial-width">
				</label><label for="iniH">
				<span>Высота (original height)</span>
				<input type="number" min="1" id="initial-height">
				</label>
			</div>
			<div class="box">
				<label for="newW">
				<span>Новая ширина (new width)</span>
				<input type="number" min="1" id="new-width">
				</label><label for="newH">
				<span>Новая высота (new height)</span>
				<input type="number" min="1" id="new-height">
				</label>
			</div>
		</div>
	</div>
</div>
